name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  steplist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: steplist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: steplist/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
